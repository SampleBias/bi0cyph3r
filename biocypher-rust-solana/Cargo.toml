[workspace]
members = ["backend"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Bi0cyph3r Team"]
license = "MIT"

[workspace.dependencies]
# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Terminal interface
ratatui = { version = "0.30.2", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"
clap = { version = "4.6", features = ["derive", "env"] }
unicode-width = "0.2"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Cryptography
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
pbkdf2 = { version = "0.12", features = ["password-hash", "simple"] }
sha2 = "0.10"
rand = "0.8"
base64 = "0.21"

# Solana (Phase 2-3)
solana-client = "2"
solana-sdk = "2"

# Utilities
regex = "1.10"
