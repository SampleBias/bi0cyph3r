# Run interactively: docker compose run --rm --user "$(id -u):$(id -g)" biocypher
services:
  biocypher:
    build:
      context: ./biocypher-rust-solana
      dockerfile: Dockerfile
    stdin_open: true
    tty: true
    environment:
      TERM: xterm-256color
      COLORTERM: truecolor
    working_dir: /data
    volumes:
      - .:/data
